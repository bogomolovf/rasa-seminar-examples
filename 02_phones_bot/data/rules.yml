version: "3.1"

rules:

- rule: Приветствие
  steps:
  - intent: greet
  - action: utter_greet

- rule: Прощание
  steps:
  - intent: goodbye
  - action: utter_goodbye

- rule: Вне области знаний
  steps:
  - intent: out_of_scope
  - action: utter_out_of_scope

# Форма активируется при запросе всех характеристик
- rule: Запрос всех характеристик — запустить форму
  steps:
  - intent: ask_phone_specs
  - action: phone_form
  - active_loop: phone_form

# Форма активируется при запросе конкретной характеристики
- rule: Запрос конкретной характеристики — запустить форму
  steps:
  - intent: ask_specific_spec
  - action: phone_form
  - active_loop: phone_form

# После заполнения формы — вернуть характеристики
- rule: Форма заполнена — показать характеристики
  condition:
  - active_loop: phone_form
  steps:
  - action: phone_form
  - active_loop: null
  - slot_was_set:
    - requested_slot: null
  - action: action_get_phone_specs
