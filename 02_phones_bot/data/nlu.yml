version: "3.1"

nlu:

# ── Стандартные интенты ────────────────────────────────────────────────────────

- intent: greet
  examples: |
    - Привет
    - Здравствуйте
    - Добрый день
    - Доброе утро
    - Привет, бот
    - Хай
    - Салют
    - Здорово

- intent: goodbye
  examples: |
    - Пока
    - До свидания
    - Всего доброго
    - Спасибо, пока
    - До встречи
    - Бывай
    - Выход
    - Закончим

- intent: out_of_scope
  examples: |
    - Расскажи анекдот
    - Какая погода?
    - Ты умеешь петь?
    - Кто тебя создал?
    - Что такое 5G?
    - Помоги с домашним заданием

# ── Запрос всех характеристик телефона ────────────────────────────────────────

- intent: ask_phone_specs
  examples: |
    - Расскажи про [iPhone 15](phone_model)
    - Что за телефон [Galaxy S24](phone_model)?
    - Покажи характеристики [Pixel 8](phone_model)
    - Какие характеристики у [Xiaomi 14](phone_model)?
    - Что ты знаешь о [OnePlus 12](phone_model)?
    - Информация о [Honor 200 Pro](phone_model)
    - Расскажи о [Redmi Note 13](phone_model)
    - Хочу узнать про [realme 12 Pro+](phone_model)
    - Покажи данные [Samsung Galaxy A55](phone_model)
    - Всё про [iPhone 15 Pro](phone_model)
    - Расскажи про телефон
    - Покажи характеристики смартфона
    - Хочу узнать характеристики
    - Что ты знаешь о смартфоне?
    - Информация о телефоне

# ── Запрос конкретной характеристики ──────────────────────────────────────────

- intent: ask_specific_spec
  examples: |
    - Какая [камера](spec_type) у [iPhone 15](phone_model)?
    - Расскажи про [батарею](spec_type) [Galaxy S24](phone_model)
    - Какой [экран](spec_type) у [Pixel 8](phone_model)?
    - Сколько [памяти](spec_type) в [Xiaomi 14](phone_model)?
    - Какой [процессор](spec_type) стоит в [OnePlus 12](phone_model)?
    - Какая [оперативная память](spec_type) у [Redmi Note 13](phone_model)?
    - [Цена](spec_type) [Honor 200 Pro](phone_model)
    - Сколько стоит [Samsung Galaxy A55](phone_model)?
    - Какой [аккумулятор](spec_type) в [realme 12 Pro+](phone_model)?
    - Какой [дисплей](spec_type) у [iPhone 15 Pro](phone_model)?
    - Какая [камера](spec_type)?
    - Какой [экран](spec_type)?
    - Расскажи про [батарею](spec_type)
    - Сколько [памяти](spec_type)?
    - Какой [процессор](spec_type)?
    - Какая [оперативная память](spec_type)?
    - Какая [цена](spec_type)?
    - Какой [аккумулятор](spec_type)?

