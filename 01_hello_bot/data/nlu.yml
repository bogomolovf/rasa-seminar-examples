version: "3.1"

nlu:
- intent: greet
  examples: |
    - Привет
    - Здравствуйте
    - Добрый день
    - Добрый вечер
    - Доброе утро
    - Приветствую
    - Хай
    - Здорово
    - Салют
    - Ку

- intent: goodbye
  examples: |
    - Пока
    - До свидания
    - Всего доброго
    - До встречи
    - Прощай
    - Спокойной ночи
    - Бывай
    - Ладно, пока
    - Завтра поговорим
    - До скорого

- intent: affirm
  examples: |
    - Да
    - Конечно
    - Именно
    - Верно
    - Ага
    - Точно
    - Так и есть
    - Правильно
    - Согласен
    - Без сомнений

- intent: deny
  examples: |
    - Нет
    - Не думаю
    - Не хочу
    - Не надо
    - Неверно
    - Нет, спасибо
    - Отказываюсь
    - Ни в коем случае
    - Совсем нет
    - Нет уж

- intent: out_of_scope
  examples: |
    - Что умеет этот бот?
    - Ты реальный человек?
    - Сколько тебе лет?
    - Кто тебя создал?
    - Что ты можешь?
    - Ты умный?
    - Расскажи о себе
    - Чем ты занимаешься?
