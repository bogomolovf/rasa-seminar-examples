# ── Telegram channel ──────────────────────────────────────────────────────────
# Реальный токен НЕ коммитим. Положи `credentials.local.yml` (gitignored) с тем же
# форматом, либо переопредели через переменные окружения и стартуй сервер так:
#   rasa run --enable-api --cors "*" --credentials credentials.local.yml
#
# Получение токена:
#   1. В Telegram открыть @BotFather
#   2. /newbot, имя и @username бота
#   3. Сохранить выданный токен
#   4. Поднять публичный URL для webhook'a (ngrok / cloudflare tunnel)
#   5. Указать в credentials.local.yml access_token и webhook_url

telegram:
  access_token: ${TELEGRAM_BOT_TOKEN}    # читается из env, либо переопредели в credentials.local.yml
  verify: ${TELEGRAM_BOT_USERNAME}       # username бота без @
  webhook_url: ${TELEGRAM_WEBHOOK_URL}   # https://your-public-host/webhooks/telegram/webhook

# ── REST channel (используется для smoke-тестов и curl) ────────────────────────
# Не удаляй — без него ломается весь существующий smoke / qa workflow.
rest:
