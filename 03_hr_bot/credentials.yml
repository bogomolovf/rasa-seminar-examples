# ── Telegram channel ──────────────────────────────────────────────────────────
# Реальный токен НЕ коммитим. Чтобы включить Telegram:
#   1. Скопируй credentials.local.yml.example → credentials.local.yml
#   2. Подставь access_token / verify / webhook_url (от @BotFather + ngrok)
#   3. Стартуй сервер:
#        rasa run --enable-api --cors "*" --credentials credentials.local.yml
#
# В этом дефолтном файле секция telegram закомментирована, чтобы `rasa shell` и
# smoke-тесты работали без переменных окружения. Раскомментируй и подставь env
# vars (TELEGRAM_BOT_TOKEN / _USERNAME / WEBHOOK_URL), если хочешь использовать
# именно credentials.yml.
#
# telegram:
#   access_token: ${TELEGRAM_BOT_TOKEN}
#   verify: ${TELEGRAM_BOT_USERNAME}
#   webhook_url: ${TELEGRAM_WEBHOOK_URL}

