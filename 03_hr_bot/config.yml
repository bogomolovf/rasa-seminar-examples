recipe: default.v1

language: ru

pipeline:
- name: WhitespaceTokenizer
  # Признаки из lookup-таблиц/regex (sparse-фичи для DIET, БЕЗ извлечения сущностей).
  # Промпт 3: нужен, чтобы DIET «видел» role-lookup как фичу.
  # RegexEntityExtractor намеренно НЕ добавляем (DESIGN.md §9): он конфликтует с DIET
  # на подстрочных названиях и перезаписывает более длинное значение DIET более
  # коротким из lookup. RegexFeaturizer таких проблем не создаёт — только sparse-фичи.
- name: RegexFeaturizer
  # Символьные n-граммы: улучшают распознавание при опечатках и падежных формах
- name: CountVectorsFeaturizer
  analyzer: char_wb
  min_ngram: 2
  max_ngram: 4
- name: CountVectorsFeaturizer
  analyzer: word
  # Классификатор интентов + теггер сущностей (DIET = Dual Intent and Entity Transformer).
  # DIET использует lookup tables через RegexFeaturizer выше (sparse-фичи).
- name: DIETClassifier
  epochs: 100
  constrain_similarities: true
  # Нормализует синонимы к каноническим именам (например, «датасаентист» → ds)
- name: EntitySynonymMapper
- name: FallbackClassifier
  threshold: 0.7
  ambiguity_threshold: 0.1

policies:
- name: MemoizationPolicy
  max_history: 5
- name: RulePolicy
  core_fallback_threshold: 0.4
  core_fallback_action_name: utter_out_of_scope
- name: TEDPolicy
  max_history: 5
  epochs: 100
