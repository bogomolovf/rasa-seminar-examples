version: "3.1"

stories:

# Промпт 6: happy-path формы — кандидат проходит все 6 обязательных слотов
# (candidate_name → candidate_email → desired_role → years_experience → skills →
# expected_salary) и форма завершается.
- story: Приветствие и полный проход формы (имя → email → роль → опыт → навыки → зарплата)
  steps:
  - intent: greet
  - action: utter_greet
  - intent: start_interview
  - action: interview_form
  - active_loop: interview_form
  - intent: inform
    entities:
      - entity: full_name
        value: Иван Петров
  - slot_was_set:
    - candidate_name: Иван Петров
  - action: interview_form
  - intent: inform
    entities:
      - entity: email
        value: ivan@example.com
  - slot_was_set:
    - candidate_email: ivan@example.com
  - action: interview_form
  - intent: inform
    entities:
      - entity: role
        value: pm
  - slot_was_set:
    - desired_role: pm
  - action: interview_form
  - intent: inform
    entities:
      - entity: years_experience
        value: "5"
  - slot_was_set:
    - years_experience: 5.0
  - action: interview_form
  - intent: inform
    entities:
      - entity: skill
        value: Python
      - entity: skill
        value: SQL
  - slot_was_set:
    - skills: ["python", "sql"]
  - action: interview_form
  - intent: inform
    entities:
      - entity: salary_amount
        value: "200000"
  - slot_was_set:
    - expected_salary: 200000.0
  - action: interview_form
  - active_loop: null
  - slot_was_set:
    - requested_slot: null
  - action: utter_role_chosen

# Пользователь подтверждает готовность через affirm после вопроса бота.
- story: Согласие на старт интервью
  steps:
  - intent: greet
  - action: utter_greet
  - intent: affirm
  - action: utter_introduce_bot

# Пользователь прерывает диалог — бот корректно сбрасывает состояние.
- story: Сброс интервью посередине
  steps:
  - intent: start_interview
  - action: interview_form
  - active_loop: interview_form
  - intent: restart_interview
  - action: action_reset_interview
  - intent: goodbye
  - action: utter_goodbye

# Промпт 5: пользователь нажал на кнопку Data Scientist — пришёл `/inform{"role":"ds"}`
# после того как уже ввёл имя и email; затем опыт и навыки.
- story: Полный проход формы для DS (кнопка) с опытом и навыками
  steps:
  - intent: start_interview
  - action: interview_form
  - active_loop: interview_form
  - intent: inform
    entities:
      - entity: full_name
        value: Мария Иванова
  - slot_was_set:
    - candidate_name: Мария Иванова
  - action: interview_form
  - intent: inform
    entities:
      - entity: email
        value: maria@example.com
  - slot_was_set:
    - candidate_email: maria@example.com
  - action: interview_form
  - intent: inform
    entities:
      - entity: role
        value: ds
  - slot_was_set:
    - desired_role: ds
  - action: interview_form
  - intent: inform
    entities:
      - entity: years_experience
        value: "3"
  - slot_was_set:
    - years_experience: 3.0
  - action: interview_form
  - intent: inform
    entities:
      - entity: skill
        value: Python
      - entity: skill
        value: PyTorch
      - entity: skill
        value: pandas
  - slot_was_set:
    - skills: ["python", "pytorch", "pandas"]
  - action: interview_form
  - intent: inform
    entities:
      - entity: salary_amount
        value: "250000"
  - slot_was_set:
    - expected_salary: 250000.0
  - action: interview_form
  - active_loop: null
  - slot_was_set:
    - requested_slot: null
  - action: utter_role_chosen

# Промпт 5: пользователь напечатал «Я data engineer» — entity нормализован synonym'ом к de.
- story: Полный проход формы для DE (текст) с опытом и навыками
  steps:
