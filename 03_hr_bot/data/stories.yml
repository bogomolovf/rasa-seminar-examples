version: "3.1"

stories:

# Простейший happy-path: пользователь поздоровался и сразу запустил интервью.
# Слоты на этом этапе не заполняем — required_slots формы пуст, форма
# деактивируется на первом же ходу. В Промптах 3+ перепишем под реальный порядок.
- story: Приветствие и запуск интервью
  steps:
  - intent: greet
  - action: utter_greet
  - intent: start_interview
  - action: interview_form
  - active_loop: interview_form
  - active_loop: null

# Пользователь подтверждает готовность через affirm после вопроса бота.
- story: Согласие на старт интервью
  steps:
  - intent: greet
  - action: utter_greet
  - intent: affirm
  - action: utter_introduce_bot

# Пользователь прерывает диалог — бот корректно сбрасывает состояние.
- story: Сброс интервью посередине
  steps:
  - intent: start_interview
  - action: interview_form
  - active_loop: interview_form
  - intent: restart_interview
  - action: action_reset_interview
  - intent: goodbye
  - action: utter_goodbye
