  - slot_was_set:
    - candidate_email: sergey@example.com
  - action: interview_form
  - intent: inform
    entities:
      - entity: role
        value: de
  - slot_was_set:
    - desired_role: de
  - action: interview_form
  - intent: inform
    entities:
      - entity: years_experience
        value: "7"
  - slot_was_set:
