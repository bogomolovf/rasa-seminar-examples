        value: ds
  - slot_was_set:
    - desired_role: ds
  - action: interview_form
  - intent: inform
    entities:
      - entity: years_experience
        value: "0"
  - slot_was_set:
    - years_experience: 0.0
  - action: interview_form
  - intent: inform
    entities:
      - entity: skill
        value: Python
  - slot_was_set:
    - skills: ["python"]
  - action: interview_form
  - intent: inform
