version: "3.1"

stories:

# Промпт 4: happy-path формы — кандидат проходит все 3 текущих обязательных слота
# (candidate_name → candidate_email → desired_role) и форма завершается.
- story: Приветствие и полный проход формы (имя → email → роль)
  steps:
  - intent: greet
  - action: utter_greet
  - intent: start_interview
  - action: interview_form
  - active_loop: interview_form
  - intent: inform
    entities:
      - entity: full_name
        value: Иван Петров
  - slot_was_set:
    - candidate_name: Иван Петров
  - action: interview_form
  - intent: inform
    entities:
      - entity: email
        value: ivan@example.com
  - slot_was_set:
    - candidate_email: ivan@example.com
  - action: interview_form
  - intent: inform
    entities:
      - entity: role
        value: pm
  - slot_was_set:
    - desired_role: pm
  - action: interview_form
  - active_loop: null
  - slot_was_set:
    - requested_slot: null
  - action: utter_role_chosen

# Пользователь подтверждает готовность через affirm после вопроса бота.
- story: Согласие на старт интервью
  steps:
  - intent: greet
  - action: utter_greet
  - intent: affirm
  - action: utter_introduce_bot

# Пользователь прерывает диалог — бот корректно сбрасывает состояние.
- story: Сброс интервью посередине
  steps:
  - intent: start_interview
  - action: interview_form
  - active_loop: interview_form
  - intent: restart_interview
  - action: action_reset_interview
  - intent: goodbye
  - action: utter_goodbye

# Промпт 4: пользователь нажал на кнопку Data Scientist — пришёл `/inform{"role":"ds"}`
# после того как уже ввёл имя и email.
- story: Выбор роли через кнопку (ds) после имени и email
  steps:
  - intent: start_interview
  - action: interview_form
  - active_loop: interview_form
  - intent: inform
    entities:
      - entity: full_name
        value: Мария Иванова
  - slot_was_set:
    - candidate_name: Мария Иванова
  - action: interview_form
  - intent: inform
    entities:
      - entity: email
        value: maria@example.com
  - slot_was_set:
    - candidate_email: maria@example.com
  - action: interview_form
  - intent: inform
    entities:
      - entity: role
        value: ds
  - slot_was_set:
    - desired_role: ds
  - action: interview_form
  - active_loop: null
  - slot_was_set:
    - requested_slot: null
  - action: utter_role_chosen

# Промпт 4: пользователь напечатал «Я data engineer» — entity нормализован synonym'ом к de.
- story: Выбор роли текстом (de) после имени и email
  steps:
  - intent: start_interview
  - action: interview_form
  - active_loop: interview_form
  - intent: inform
    entities:
      - entity: full_name
        value: Сергей Морозов
  - slot_was_set:
    - candidate_name: Сергей Морозов
  - action: interview_form
  - intent: inform
    entities:
      - entity: email
        value: sergey@example.com
  - slot_was_set:
    - candidate_email: sergey@example.com
  - action: interview_form
  - intent: inform
    entities:
      - entity: role
        value: de
  - slot_was_set:
    - desired_role: de
  - action: interview_form
  - active_loop: null
  - slot_was_set:
    - requested_slot: null
  - action: utter_role_chosen
