version: "3.1"

nlu:

# ── Приветствие ────────────────────────────────────────────────────────────────

- intent: greet
  examples: |
    - Привет
    - Здравствуйте
    - Добрый день
    - Доброе утро
    - Добрый вечер
    - Привет, бот
    - Здравствуй
    - Хай
    - Салют

# ── Прощание ───────────────────────────────────────────────────────────────────

- intent: goodbye
  examples: |
    - Пока
    - До свидания
    - Спасибо, на этом всё
    - Спасибо, пока
    - Бывай
    - До встречи
    - Всего доброго
    - Закончим
    - Выход

# ── Out-of-scope ───────────────────────────────────────────────────────────────

- intent: out_of_scope
  examples: |
    - Какая погода в Москве?
    - Расскажи анекдот
    - Реши задачу
    - Что ты умеешь, кроме HR?
    - Закажи мне пиццу
    - Кто выиграл матч вчера?
    - Помоги с домашкой
    - Где найти работу мечты?

# ── Bot challenge — «ты бот?» ──────────────────────────────────────────────────

- intent: bot_challenge
  examples: |
    - Ты бот?
    - Это бот?
    - Ты человек?
    - С кем я общаюсь?
    - Кто ты?
    - Ты живой?
    - Ты настоящий или робот?
    - Я разговариваю с программой?

# ── Старт собеседования ────────────────────────────────────────────────────────

- intent: start_interview
  examples: |
    - Хочу пройти собеседование
    - Давай начнём
    - Готов к интервью
    - Начнём скрининг
    - Поехали
    - Начать собеседование
    - Стартуем
    - Готов отвечать на вопросы
    - Хочу подать заявку
    - Начать

# ── Сброс / рестарт интервью ──────────────────────────────────────────────────

- intent: restart_interview
  examples: |
    - Начать заново
    - Сброс
    - Перезапусти интервью
    - Хочу начать с начала
    - Сбрось всё
    - Reset
    - Перезагрузка
    - Давай сначала

# ── Подтверждение ──────────────────────────────────────────────────────────────

- intent: affirm
  examples: |
    - Да
    - Конечно
    - Согласен
    - Готов
    - Давай
    - Ага
    - Точно
    - Да, давайте
    - Подтверждаю
    - Окей

# ── Отказ ──────────────────────────────────────────────────────────────────────

- intent: deny
  examples: |
    - Нет
    - Не хочу
    - Откажусь
    - Не сейчас
    - Пропусти
    - Не буду отвечать
    - Не надо
    - Нет, спасибо

# ── Inform — свободный ответ в форме (Промпт 3: только entity `role`) ──────────
# Канонические значения роли (pm/da/de/ds/mlops) проставляются:
#  • либо прямо в аннотации (`[pm](role)`),
#  • либо через synonym-секции ниже (например, `[датасаентист](role:ds)`).
# Минимум 20 примеров с разнообразной формулировкой.

- intent: inform
  examples: |
    - Хочу как [Data Scientist](role:ds)
    - [мл-опс](role:mlops)
    - попробую [pm](role)
    - Я [data engineer](role:de)
    - [Data Analyst](role:da), пожалуйста
    - Иду на [ds](role)
    - [Project Manager](role:pm)
    - буду пробовать [аналитика данных](role:da)
    - [MLOps Engineer](role:mlops)
    - Меня интересует роль [дата-инженера](role:de)
    - откликаюсь на [data scientist](role:ds)
    - хочу [проджект](role:pm)
    - давайте [de](role)
    - выбираю [mlops](role)
    - я [датасаентист](role:ds)
    - смотрю на позицию [DA](role:da)
    - подаюсь как [data engineer](role:de)
    - роль — [продакт менеджер](role:pm)
    - можно [млопс](role:mlops)
    - тестируюсь на [DS](role:ds)
    - выбираю позицию [аналитик](role:da)
    - хотел бы [pm](role)
    - давайте [data analyst](role:da)
    - откликнусь на [data scientist](role:ds)
    - я инженер данных — [de](role)
    - роль [mlops](role)

