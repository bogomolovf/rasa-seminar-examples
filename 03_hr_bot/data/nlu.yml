version: "3.1"

nlu:

# ── Приветствие ────────────────────────────────────────────────────────────────

- intent: greet
  examples: |
    - Привет
    - Здравствуйте
    - Добрый день
    - Доброе утро
    - Добрый вечер
    - Привет, бот
    - Здравствуй
    - Хай
    - Салют

# ── Прощание ───────────────────────────────────────────────────────────────────

- intent: goodbye
  examples: |
    - Пока
    - До свидания
    - Спасибо, на этом всё
    - Спасибо, пока
    - Бывай
    - До встречи
    - Всего доброго
    - Закончим
    - Выход

# ── Out-of-scope ───────────────────────────────────────────────────────────────

- intent: out_of_scope
  examples: |
    - Какая погода в Москве?
    - Расскажи анекдот
    - Реши задачу
    - Что ты умеешь, кроме HR?
    - Закажи мне пиццу
    - Кто выиграл матч вчера?
    - Помоги с домашкой
    - Где найти работу мечты?

# ── Bot challenge — «ты бот?» ──────────────────────────────────────────────────

- intent: bot_challenge
  examples: |
    - Ты бот?
    - Это бот?
    - Ты человек?
    - С кем я общаюсь?
    - Кто ты?
    - Ты живой?
    - Ты настоящий или робот?
    - Я разговариваю с программой?

# ── Старт собеседования ────────────────────────────────────────────────────────

- intent: start_interview
  examples: |
    - Хочу пройти собеседование
    - Давай начнём
    - Готов к интервью
    - Начнём скрининг
    - Поехали
    - Начать собеседование
    - Стартуем
    - Готов отвечать на вопросы
    - Хочу подать заявку
    - Начать

# ── Сброс / рестарт интервью ──────────────────────────────────────────────────

- intent: restart_interview
  examples: |
    - Начать заново
    - Сброс
    - Перезапусти интервью
    - Хочу начать с начала
    - Сбрось всё
    - Reset
    - Перезагрузка
    - Давай сначала

# ── Подтверждение ──────────────────────────────────────────────────────────────

- intent: affirm
  examples: |
    - Да
    - Конечно
    - Согласен
    - Готов
    - Давай
    - Ага
    - Точно
    - Да, давайте
    - Подтверждаю
    - Окей

# ── Отказ ──────────────────────────────────────────────────────────────────────

- intent: deny
  examples: |
    - Нет
    - Не хочу
    - Откажусь
    - Не сейчас
    - Пропусти
    - Не буду отвечать
    - Не надо
    - Нет, спасибо
