version: "3.1"

rules:

# ── Базовые ────────────────────────────────────────────────────────────────────

- rule: Приветствие
  steps:
  - intent: greet
  - action: utter_greet

- rule: Прощание
  steps:
  - intent: goodbye
  - action: utter_goodbye

- rule: Вне области знаний
  steps:
  - intent: out_of_scope
  - action: utter_out_of_scope

- rule: Бот challenge
  steps:
  - intent: bot_challenge
  - action: utter_iamabot

# ── Запуск формы собеседования ─────────────────────────────────────────────────

- rule: Старт собеседования — запустить interview_form
  steps:
  - intent: start_interview
  - action: interview_form
  - active_loop: interview_form

# ── Завершение формы — подтверждение выбранной роли ───────────────────────────
# Промпт 3: после заполнения всех required_slots формы (пока — только desired_role)
# показываем utter_role_chosen. `action_assess_candidate` подключим в Промпте 7.

- rule: Завершение interview_form — подтверждение роли
  condition:
  - active_loop: interview_form
  steps:
  - action: interview_form
  - active_loop: null
  - slot_was_set:
    - requested_slot: null
  - action: utter_role_chosen

# ── Сброс интервью ─────────────────────────────────────────────────────────────

- rule: Перезапуск интервью
  steps:
  - intent: restart_interview
  - action: action_reset_interview
