# ── 5. RESTART-MID-FORM: сброс посередине заполнения формы ────────────────────
- story: TEST RESTART — сброс посередине формы (на этапе role)
  steps:
  - intent: start_interview
  - action: interview_form
  - active_loop: interview_form
  - intent: inform
    entities:
      - entity: full_name
        value: Алексей Иванов
  - slot_was_set:
    - candidate_name: Алексей Иванов
  - action: interview_form
  - intent: inform
    entities:
      - entity: email
        value: alex@example.com
  - slot_was_set:
    - candidate_email: alex@example.com
  - action: interview_form
  - intent: restart_interview
  - action: action_reset_interview
  - active_loop: null

# ── 6. OOS-IN-FORM: out_of_scope внутри формы → продолжаем ────────────────────
- story: TEST OOS-IN-FORM — out_of_scope в форме → продолжаем интервью
  steps:
  - intent: start_interview
  - action: interview_form
  - active_loop: interview_form
  - intent: inform
    entities:
      - entity: full_name
        value: Дмитрий Соколов
  - slot_was_set:
    - candidate_name: Дмитрий Соколов
  - action: interview_form
  - intent: out_of_scope
  - action: utter_please_continue_form
  - action: interview_form
  - active_loop: interview_form
