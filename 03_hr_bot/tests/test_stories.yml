  - slot_was_set:
    - desired_role: ds
  - action: interview_form
  - intent: inform
    entities:
      - entity: years_experience
        value: "5"
  - slot_was_set:
    - years_experience: 5.0
  - action: interview_form
  - intent: inform
    entities:
      - entity: skill
        value: SQL
      - entity: skill
